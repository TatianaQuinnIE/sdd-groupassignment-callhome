<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calling Home</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    li { margin: 0.5rem 0; }
    .ok { color: #1a7f37; }
    .down { color: #b42318; }
  </style>
  <!-- Service URLs: localhost in compose, Azure URLs written by the pipeline on deploy. -->
  <script src="config.js"></script>
</head>
<body>
  <h1>Calling Home</h1>
  <h2>Service status</h2>
  <ul>
    <li>contacts-service: <span id="contacts">checking…</span></li>
    <li>overlap-service: <span id="overlap">checking…</span></li>
  </ul>
  <button id="recheck">Check again</button>

  <script>
    const TIMEOUT_MS = 10000; // never wait forever for a service

    async function checkHealth(baseUrl, elementId) {
      const el = document.getElementById(elementId);
      el.textContent = "checking…";
      el.className = "";
      try {
        const response = await fetch(baseUrl + "/health", {
          signal: AbortSignal.timeout(TIMEOUT_MS),
        });
        if (response.ok) {
          el.textContent = "OK";
          el.className = "ok";
        } else {
          el.textContent = "error (HTTP " + response.status + "), try again in a minute";
          el.className = "down";
        }
      } catch (error) {
        // Timeout, network error or CORS refusal: the service is down or still starting.
        el.textContent = "not responding, it may be starting up, try again in a minute";
        el.className = "down";
      }
    }

    function checkAll() {
      checkHealth(window.APP_CONFIG.contactsUrl, "contacts");
      checkHealth(window.APP_CONFIG.overlapUrl, "overlap");
    }

    document.getElementById("recheck").addEventListener("click", checkAll);
    checkAll();
  </script>
</body>
</html>
