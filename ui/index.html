<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calling Home</title>
  <link rel="stylesheet" href="style.css">
  <!-- Service URLs: localhost in compose, Azure URLs written by the pipeline on deploy. -->
  <script src="config.js"></script>
  <script src="api.js"></script>
</head>
<body>
  <header>
    <h1>Calling Home</h1>
    <p class="status">
      Contacts: <span id="status-contacts">checking…</span> ·
      Suggestions: <span id="status-overlap">checking…</span> ·
      <button id="recheck" type="button">Check again</button>
    </p>
  </header>

  <!-- Shown when something fails, so the page never just goes blank. -->
  <div id="banner" class="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button id="banner-close" type="button">Dismiss</button>
  </div>

  <script>
    function showError(message) {
      document.getElementById("banner-text").textContent = message;
      document.getElementById("banner").hidden = false;
    }

    function hideError() {
      document.getElementById("banner").hidden = true;
    }

    async function checkHealth(service) {
      const el = document.getElementById("status-" + service);
      el.textContent = "checking…";
      el.className = "";
      try {
        await callService(service, "/health");
        el.textContent = "OK";
        el.className = "ok";
      } catch (error) {
        el.textContent = "not responding";
        el.className = "down";
        showError(error.message);
      }
    }

    function checkAll() {
      hideError();
      checkHealth("contacts");
      checkHealth("overlap");
    }

    document.getElementById("recheck").addEventListener("click", checkAll);
    document.getElementById("banner-close").addEventListener("click", hideError);
    checkAll();
  </script>
</body>
</html>
