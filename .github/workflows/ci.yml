name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*/requirements*.txt"

      # A service is checked as soon as it has an app/ folder.
      - name: Find services
        run: |
          services=""
          for service in contacts-service overlap-service; do
            if [ -d "$service/app" ]; then
              services="$services $service"
            else
              echo "Skipping $service: no app/ folder yet"
            fi
          done
          echo "SERVICES=$services" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          for service in $SERVICES; do
            python -m venv "$service/.venv"
            "$service/.venv/bin/pip" install -r "$service/requirements-dev.txt"
          done

      - name: Lint (ruff check)
        run: |
          for service in $SERVICES; do
            (cd "$service" && .venv/bin/ruff check .)
          done

      - name: Format check (ruff format)
        run: |
          for service in $SERVICES; do
            (cd "$service" && .venv/bin/ruff format --check .)
          done

      - name: Tests (pytest)
        run: |
          for service in $SERVICES; do
            (cd "$service" && .venv/bin/python -m pytest)
          done
