name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history so the secret scan can read every commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*/requirements*.txt"

      # A service is checked as soon as it has an app/ folder.
      - name: Find services
        run: |
          services=""
          for service in contacts-service overlap-service; do
            if [ -d "$service/app" ]; then
              services="$services $service"
            else
              echo "Skipping $service: no app/ folder yet"
            fi
          done
          echo "SERVICES=$services" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m venv .tools
          .tools/bin/pip install bandit==1.9.4 pip-audit==2.10.1
          for service in $SERVICES; do
            python -m venv "$service/.venv"
            "$service/.venv/bin/pip" install -r "$service/requirements-dev.txt"
          done

      - name: Lint (ruff check)
        run: |
          for service in $SERVICES; do
            (cd "$service" && .venv/bin/ruff check .)
          done

      - name: Format check (ruff format)
        run: |
          for service in $SERVICES; do
            (cd "$service" && .venv/bin/ruff format --check .)
          done

      - name: Tests with coverage gate (fails under 70%)
        run: |
          for service in $SERVICES; do
            (cd "$service" && .venv/bin/python -m pytest --cov --cov-report=term-missing --cov-fail-under=70)
          done

      - name: Security check (Bandit)
        run: |
          for service in $SERVICES; do
            .tools/bin/bandit -r "$service/app" -q
          done

      - name: Dependency audit (pip-audit)
        run: |
          for service in $SERVICES; do
            .tools/bin/pip-audit -r "$service/requirements.txt"
          done
